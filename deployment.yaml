apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agri
  template:
    metadata:
      labels:
        app: smart-agri
    spec:
      containers:
      - name: agri-portal
        image: 24mis0010/smart-agri-portal:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agri-service
spec:
  type: NodePort
  selector:
    app: smart-agri
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007